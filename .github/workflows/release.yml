# A release with the built package attached, so the web apps install it by tarball URL (no
# registry account needed). Called by release-please.yml when its release is made; a version tag
# pushed by hand runs it too.
name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag: { type: string, required: true }

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test "$(node -p "require('./package.json').version")" = "${TAG#v}" || { echo "package.json version differs from the tag"; exit 1; }
      - run: pnpm build && npm pack
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: likho-ai-ui-*.tgz
          append_body: true
          body: |
            Install: `"@likho-ai/ui": "https://github.com/likho-ai/likho-ui/releases/download/${{ env.TAG }}/likho-ai-ui-${{ env.TAG }}.tgz"` (file name without the `v`).
